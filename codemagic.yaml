workflows:
  ios-simulator-build:
    name: Vimai HitRise iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "hitrise-ios/VimaiHitRise.xcodeproj"
        XCODE_SCHEME: "VimaiHitRise"
        BUNDLE_ID: "com.zclei.hitrise"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Show project schemes
        script: xcodebuild -list -project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Build app for iOS Simulator
        script: |
          xcodebuild clean build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - build/DerivedData/**/Build/**/*.app
      - build/DerivedData/**/Build/**/*.dSYM
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-app-store-ipa:
    name: Vimai HitRise Signed IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic App Store Connect"
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zclei.hitrise
      vars:
        XCODE_PROJECT: "hitrise-ios/VimaiHitRise.xcodeproj"
        XCODE_SCHEME: "VimaiHitRise"
        BUNDLE_ID: "com.zclei.hitrise"
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          BUILD_NUMBER_TO_USE="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          echo "Using TestFlight build number: $BUILD_NUMBER_TO_USE"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER_TO_USE"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
