<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HitRise 实时训练配色 04 麦浪青野</title>
  <link rel="stylesheet" href="hitrise_realtime_training_palettes.css" />
  <style>
    :root {
      --page-top: #031307;
      --page-bottom: #040603;
      --shell: #102016;
      --shell-dark: #030904;
      --panel: #16281b;
      --hero: #f1ece0;
      --hero-light: #fac75e;
      --hero-text: #117c0d;
      --accent: #117c0d;
      --highlight: #fac75e;
      --hot: #f1ece0;
      --glow: #fac75e;
      --rim: #fac75e;
      --line: #fac75e;
      --text: #fff7e8;
      --muted: #b7c7aa;
      --subtle: #fac75e;
      --headline: #ffe08a;
      --battery: #87e184;
      --ring-core: #071308;
      --force-hot: #fac75e;
      --force-mid: #6bbf36;
      --force-low: #117c0d;
      --chip: #117c0d;
      --chip-text: #f7ffe7;
      --button: #fac75e;
      --button-hot: #117c0d;
      --button-text: #061306;
      --nav: #071308;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="HitRise realtime training palette four">
      <div class="content">
        <div class="status">
          <div class="brand"><span class="brand-mark"></span><span>HitRise Live</span></div>
          <div>SENBALL#A</div>
          <div class="battery"><span class="battery-icon"></span><span>86%</span></div>
        </div>

        <section class="hero">
          <div class="hero-top">
            <div class="title">
              <h1>实时训练</h1>
              <p>麻纸米白 + 草木深绿 + 麦秆暖黄耐力感</p>
            </div>
            <div class="gear">⚙</div>
          </div>
          <div class="goal">
            <strong>今日目标：500拳　已完成 286拳</strong>
            <div class="progress"><span></span></div>
          </div>
        </section>

        <section class="dashboard">
          <div class="timer-card">
            <div class="ring">
              <div class="ring-inner">
                <div>
                  <div class="time">00:42</div>
                  <div class="time-label">第 1 回合 / 持续燃动</div>
                </div>
              </div>
            </div>
          </div>
          <div class="coach-card">
            <div class="coach-title"><span>AI 教练</span><span>节奏 92%</span></div>
            <div>
              <div class="punch-count">286</div>
              <div class="punch-label">累计击拳</div>
            </div>
            <div class="rhythm-wave">
              <i style="--h:30;--d:1"></i><i style="--h:70;--d:2"></i><i style="--h:46;--d:3"></i><i style="--h:84;--d:4"></i><i style="--h:62;--d:5"></i><i style="--h:90;--d:6"></i><i style="--h:52;--d:7"></i>
            </div>
          </div>
        </section>

        <section class="metrics">
          <div class="metric"><span>BPM</span><strong>118</strong><small>耐力输出</small></div>
          <div class="metric"><span>卡路里</span><strong>46.8</strong><small>kcal</small></div>
          <div class="metric"><span>等效燃脂</span><strong>6.1</strong><small>g</small></div>
        </section>

        <section class="dashboard">
          <div class="force-card">
            <div class="section-head"><span>相对力量评分</span><span class="force-value">742</span></div>
            <div class="force-bars">
              <i style="--h:25;--d:1"></i><i style="--h:41;--d:2"></i><i style="--h:55;--d:3"></i><i style="--h:65;--d:4"></i><i style="--h:81;--d:5"></i><i style="--h:53;--d:6"></i><i style="--h:87;--d:7"></i><i style="--h:45;--d:8"></i><i style="--h:75;--d:9"></i><i style="--h:91;--d:10"></i>
            </div>
            <div class="force-summary"><div>最小 315</div><div>平均 628</div><div>最大 1038</div></div>
          </div>
          <div class="report-card">
            <div class="section-head"><span>有氧节奏</span><span>120 BPM</span></div>
            <div class="beat-line"><div class="beat"></div><div class="accuracy">84%</div></div>
            <div class="combo"><span>耐力连击</span><span>连续 12拳</span><span>Perfect +8</span></div>
          </div>
        </section>

        <section class="action-bar">
          <button class="btn">开始</button>
          <button class="btn secondary">结束</button>
        </section>

        <section class="mode-row">
          <span>训练设置</span>
          <strong>初学者｜1分钟 x 3回合</strong>
        </section>

        <nav class="nav">
          <div class="active"><b></b><span>训练中心</span></div>
          <div><b></b><span>锻炼成果</span></div>
          <div><b></b><span>榜单排名</span></div>
          <div><b></b><span>个人中心</span></div>
        </nav>
      </div>
    </section>
  </main>
</body>
</html>
