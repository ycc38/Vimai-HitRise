<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HitRise 实时训练 · 铂金奢华版</title>
  <style>
    :root {
      --ink:        #010204;
      --bg-deep:    #04060a;
      --panel:      rgba(12, 15, 22, 0.92);
      --panel-2:    rgba(18, 22, 32, 0.88);

      /* 铂金 / 香槟金属轴 */
      --plat-1:     #e8e0d0;   /* 铂白高光 */
      --plat-2:     #c8bfa8;   /* 香槟银 */
      --gold-1:     #f0c96a;   /* 金冠 */
      --gold-2:     #c89a2e;   /* 深金 */
      --gold-3:     #7a5a10;   /* 琥珀底 */
      --copper:     #d4703a;   /* 铜橙（燃） */
      --ember:      #b83030;   /* 深燃红 */

      /* 荧光绿 —— 克制保留，仅2处 */
      --neon-green: #1de592;   /* 燃脂g & ROUND徽章 */
      --neon-dim:   #0fa868;

      --text:       #f0ece4;
      --text-2:     #7e8898;
      --border-g:   rgba(200, 159, 46, 0.28);
      --border-dim: rgba(255, 255, 255, 0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── 动画 ── */
    @keyframes speedSlide {
      from { transform: translateY(-36px) translateX(-18px); }
      to   { transform: translateY(36px)  translateX(18px);  }
    }
    @keyframes sweep {
      0%,38%  { transform: translateX(-140%); }
      78%,100%{ transform: translateX(140%);  }
    }
    @keyframes metalSheen {
      0%,40%  { transform: translateX(-140%); opacity:.18; }
      80%,100%{ transform: translateX(140%);  opacity:0;   }
    }
    @keyframes ringBreath {
      0%,100%{ transform:scale(1);      box-shadow: 0 0 28px rgba(200,154,46,.16), 0 0 60px rgba(200,154,46,.06); }
      50%    { transform:scale(1.018);  box-shadow: 0 0 44px rgba(200,154,46,.30), 0 0 80px rgba(200,154,46,.12); }
    }
    @keyframes orbitCW {
      to { transform: rotate(360deg); }
    }
    @keyframes orbitCCW {
      to { transform: rotate(-360deg); }
    }
    @keyframes burnBar {
      0%,100%{ width:37%; filter:brightness(.92); }
      50%    { width:40%; filter:brightness(1.22) drop-shadow(0 0 5px var(--gold-1)); }
    }
    @keyframes goFlash {
      0%,100%{ opacity:.32; letter-spacing:.06em; color:var(--plat-2); }
      50%    { opacity:1;   letter-spacing:.14em; color:var(--gold-1);
               text-shadow: 0 0 12px rgba(240,201,106,.55); }
    }
    @keyframes impactBar {
      0%,100%{ transform:scaleY(.90) skewX(-1.5deg); filter:brightness(.86); }
      50%    { transform:scaleY(1.12) skewX(1.5deg);  filter:brightness(1.28); }
    }
    @keyframes comboShine {
      0%  { background-position:0% 50%; }
      100%{ background-position:200% 50%; }
    }
    @keyframes neonPulse {
      0%,100%{ opacity:.7;  text-shadow:none; }
      50%    { opacity:1;   text-shadow: 0 0 10px rgba(29,229,146,.5); }
    }
    @keyframes goldPulse {
      0%,100%{ opacity:.85; }
      50%    { opacity:1; text-shadow: 0 0 14px rgba(240,201,106,.45); }
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 28% 0%,   rgba(180,130,30,.12),  transparent 42%),
        radial-gradient(ellipse at 82% 18%,  rgba(120,80,20,.08),   transparent 36%),
        radial-gradient(ellipse at 55% 88%,  rgba(180,48,48,.07),   transparent 38%),
        linear-gradient(160deg, #020408, #060810 55%, #030508);
      font-family: "SF Pro Display","PingFang SC","Microsoft YaHei",Arial,sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .wrap { padding: 22px; }

    /* ── 手机外壳 ── */
    .phone {
      position: relative;
      width: 390px; height: 844px;
      overflow: hidden;
      border-radius: 46px;
      background: linear-gradient(150deg, #0c1018, #060810);
      border: 1px solid rgba(255,255,255,.13);
      box-shadow:
        0 0 0 1px rgba(200,159,46,.14),
        0 44px 110px rgba(0,0,0,.90),
        0 0 70px  rgba(180,130,30,.07),
        inset 0 1px 0 rgba(255,255,255,.11),
        inset 0 0 60px rgba(0,0,0,.4);
    }

    /* 顶部环境光晕 */
    .phone::before {
      content:"";
      position:absolute; inset:-50px -30px auto; height:220px;
      background:
        radial-gradient(circle at 38% 45%, rgba(200,154,46,.20), transparent 52%),
        radial-gradient(circle at 72% 55%, rgba(180,48,48,.10),  transparent 44%);
      filter:blur(18px); pointer-events:none;
    }

    /* 破风线 */
    .speed-lines {
      position:absolute; inset:0; pointer-events:none; opacity:.35;
      background:
        repeating-linear-gradient(112deg, transparent 0 38px, rgba(200,185,140,.025) 38px 39px, transparent 39px 76px),
        repeating-linear-gradient(112deg, transparent 0 72px, rgba(240,200,100,.018) 72px 73px, transparent 73px 144px);
      animation: speedSlide 5s linear infinite;
    }

    /* 液态金属掠影（主） */
    .metal-sweep {
      position:absolute; inset:0; pointer-events:none;
      background: linear-gradient(108deg,
        transparent 22%,
        rgba(232,224,208,.13) 26%,
        rgba(255,255,255,.22) 29%,
        rgba(232,224,208,.10) 32%,
        transparent 40%);
      transform: translateX(-140%);
      animation: sweep 4.4s cubic-bezier(.22,.8,.44,1) infinite;
    }

    /* 第二道细光（延迟） */
    .metal-sweep-2 {
      position:absolute; inset:0; pointer-events:none;
      background: linear-gradient(108deg,
        transparent 30%,
        rgba(200,159,46,.10) 33%,
        rgba(240,201,106,.18) 35%,
        transparent 41%);
      transform: translateX(-140%);
      animation: metalSheen 4.4s cubic-bezier(.22,.8,.44,1) infinite 2.2s;
    }

    .content {
      position:relative; z-index:2;
      height:100%; padding:14px 15px 18px;
      display:flex; flex-direction:column; gap:11px;
    }

    /* ── 状态栏 ── */
    .status {
      height:26px; display:flex;
      justify-content:space-between; align-items:center;
      padding:0 8px; font-size:12.5px; font-weight:600; color:var(--text-2);
    }
    .battery {
      color: var(--gold-1);
      background: rgba(200,154,46,.10);
      padding: 2px 9px; border-radius:6px;
      font-size:11px; font-weight:800;
      border: 1px solid rgba(200,159,46,.22);
    }

    /* ── HERO 卡 ── */
    .hero {
      position:relative; overflow:hidden;
      border-radius:24px; padding:16px;
      background: linear-gradient(148deg, rgba(22,26,38,.95), rgba(10,12,18,.98));
      border: 1px solid var(--border-g);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        inset 0 0 40px rgba(0,0,0,.3),
        0 18px 44px rgba(0,0,0,.45),
        0 0 28px rgba(200,154,46,.05);
    }
    .hero::after {
      content:""; position:absolute; inset:0; border-radius:inherit;
      background: linear-gradient(118deg,
        transparent 24%, rgba(255,255,255,.07) 32%, transparent 40%);
      transform:translateX(-100%);
      animation: sweep 6s ease-in-out infinite 1.5s;
      pointer-events:none;
    }

    .top { display:flex; justify-content:space-between; align-items:center; }

    .title {
      font-size:21px; font-weight:900; letter-spacing:-.4px;
      background: linear-gradient(88deg, #f0ece4 0%, #c8bfa8 55%, #f0c96a 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .subtitle {
      margin-top:4px; font-size:10.5px; font-weight:800;
      text-transform:uppercase; letter-spacing:1.4px;
      color: var(--gold-2);
    }

    .gear {
      height:36px; padding:0 12px; border-radius:12px;
      border:1px solid var(--border-g);
      display:flex; align-items:center; gap:5px;
      background: linear-gradient(160deg, rgba(200,154,46,.12), rgba(200,154,46,.04));
      color:var(--gold-1); font-size:12px; font-weight:700;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }

    /* 目标进度 */
    .goal {
      margin-top:14px; border-radius:16px; padding:13px;
      background: linear-gradient(128deg,
        rgba(200,154,46,.13) 0%,
        rgba(180,80,48,.07) 60%,
        rgba(120,54,16,.05) 100%);
      border: 1px solid rgba(200,159,46,.26);
    }
    .goal strong {
      display:block; font-size:15px; font-weight:800; color:var(--plat-1);
      text-shadow: 0 1px 8px rgba(200,154,46,.18);
    }
    .goal small { display:block; margin-top:4px; font-size:11.5px; color:var(--text-2); }

    .bar {
      margin-top:10px; height:7px; border-radius:99px;
      background: rgba(0,0,0,.55);
      overflow:hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }
    .bar i {
      display:block; height:100%; border-radius:inherit;
      background: linear-gradient(90deg, var(--ember), var(--copper), var(--gold-1), var(--plat-2));
      box-shadow: 0 0 14px rgba(200,154,46,.38);
      animation: burnBar 2.2s cubic-bezier(.4,0,.2,1) infinite;
    }

    /* ── DASH 卡 ── */
    .dash {
      flex:1; min-height:0; overflow:hidden;
      border-radius:26px; padding:14px;
      background: linear-gradient(152deg, rgba(16,20,30,.96), rgba(8,10,16,.98));
      border: 1px solid var(--border-dim);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.055),
        0 14px 32px rgba(0,0,0,.38);
      position:relative;
    }
    .dash::after {
      content:""; position:absolute; inset:0; border-radius:inherit;
      background: linear-gradient(118deg,
        transparent 26%, rgba(255,255,255,.05) 33%, transparent 42%);
      transform:translateX(-100%);
      animation: sweep 7s ease-in-out infinite 3s;
      pointer-events:none;
    }

    /* 回合行 */
    .round-row {
      position:relative; z-index:1;
      display:flex; justify-content:space-between; align-items:center;
    }
    .label { font-size:15px; font-weight:800; color:var(--plat-2); }
    .round {
      padding:5px 14px; border-radius:999px;
      font-size:11.5px; font-weight:900;
      /* 荧光绿保留处 #1 */
      color: #03301e;
      background: linear-gradient(90deg, var(--neon-green), #5fffc6);
      box-shadow: 0 0 14px rgba(29,229,146,.22), 0 2px 8px rgba(0,0,0,.3);
      letter-spacing:.4px;
    }

    /* 计时圆环 */
    .timer-area {
      position:relative; z-index:1;
      height:168px; display:grid; place-items:center;
      margin:6px 0;
    }
    .ring {
      position:relative; width:150px; height:150px;
      border-radius:50%; display:grid; place-items:center;
      background: conic-gradient(from -90deg,
        var(--ember)  0deg,
        var(--copper) 50deg,
        var(--gold-2) 100deg,
        var(--gold-1) 145deg,
        var(--plat-2) 172deg,
        rgba(255,255,255,.06) 175deg 360deg
      );
      animation: ringBreath 2.4s ease-in-out infinite;
    }
    /* 内圈遮罩 */
    .ring::before {
      content:""; position:absolute; inset:9px;
      border-radius:50%;
      background: radial-gradient(circle, #0c1018 0 50%, #141a26 100%);
      border: 1px solid rgba(200,159,46,.12);
    }
    /* 外轨道 CW */
    .ring-orbit {
      position:absolute; inset:-7px; border-radius:50%;
      border: 1.5px solid rgba(200,159,46,.26);
      border-left-color:transparent; border-bottom-color:transparent;
      animation: orbitCW 3s linear infinite;
    }
    /* 内轨道 CCW */
    .ring-orbit-2 {
      position:absolute; inset:-13px; border-radius:50%;
      border: 1px solid rgba(255,255,255,.08);
      border-top-color:transparent; border-right-color:transparent;
      animation: orbitCCW 5s linear infinite;
    }

    .time { position:relative; text-align:center; z-index:1; }
    .time b {
      display:block; font-size:42px; line-height:1;
      font-weight:900; letter-spacing:-.5px;
      font-variant-numeric:tabular-nums;
      background: linear-gradient(170deg, #ffffff 0%, #e0d8c8 45%, #c8b880 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .time span {
      display:block; margin-top:4px;
      font-size:10px; font-weight:800; letter-spacing:2.2px; text-transform:uppercase;
      color: var(--gold-2);
      animation: goldPulse 2s ease-in-out infinite;
    }

    .go {
      position:absolute; bottom:-4px; width:100%;
      text-align:center; font-size:12px; font-weight:900;
      animation: goFlash 1.1s ease-in-out infinite;
    }

    /* 数据矩阵 */
    .metrics {
      position:relative; z-index:1;
      display:grid; grid-template-columns:repeat(4,1fr); gap:7px;
    }
    .metric {
      min-height:70px; border-radius:14px; padding:9px 4px;
      text-align:center;
      background: linear-gradient(158deg, rgba(255,255,255,.065), rgba(255,255,255,.022));
      border: 1px solid rgba(200,159,46,.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    }
    .metric b { display:block; font-size:21px; line-height:1.15; font-weight:900; font-variant-numeric:tabular-nums; }
    .metric small { display:block; margin-top:5px; color:var(--text-2); font-size:10px; line-height:1.3; }
    /* 铂白 — 击打数 */
    .metric.white b { color:var(--plat-1); }
    /* 铜橙 — 卡路里 */
    .metric.hot b   { color:var(--copper); text-shadow:0 0 14px rgba(212,112,58,.30); }
    /* 荧光绿保留处 #2 — 燃脂g */
    .metric.fat b   { color:var(--neon-green); animation:neonPulse 2s ease-in-out infinite;
                      text-shadow:0 0 12px rgba(29,229,146,.25); }
    /* 金色 — BPM */
    .metric.bpm b   { color:var(--gold-1); text-shadow:0 0 14px rgba(240,201,106,.28); }

    /* 爆发力波形 */
    .force {
      position:relative; z-index:1;
      margin-top:9px; border-radius:16px; padding:11px;
      background: rgba(0,0,0,.32);
      border: 1px solid rgba(200,159,46,.10);
    }
    .force-head {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:9px; font-size:12px; font-weight:800; color:var(--plat-2);
    }
    .peak {
      padding:3px 10px; border-radius:999px; font-size:11px; font-weight:800;
      background: rgba(184,48,48,.16); color:#ffb8b8;
      border:1px solid rgba(184,48,48,.28);
    }
    .bars {
      height:68px; display:flex; align-items:flex-end; gap:4px; padding-top:4px;
    }
    .bars i {
      flex:1; min-width:0; border-radius:4px 4px 1px 1px;
      background: linear-gradient(180deg,
        var(--ember)  0%,
        var(--copper) 30%,
        var(--gold-2) 58%,
        var(--gold-1) 80%,
        var(--plat-2) 100%);
      box-shadow: 0 0 8px rgba(200,154,46,.16);
      transform-origin:bottom;
      animation: impactBar 1.35s ease-in-out infinite;
    }
    .bars i:nth-child(2n)  { animation-delay:.08s; }
    .bars i:nth-child(3n)  { animation-delay:.17s; }
    .bars i:nth-child(5n)  { animation-delay:.26s; }
    .bars i:nth-child(7n)  { animation-delay:.35s; }

    .summary {
      margin-top:8px; display:grid; grid-template-columns:repeat(3,1fr);
      gap:4px; font-size:10.5px; color:var(--text-2); text-align:center;
    }
    .summary b { display:block; color:var(--plat-1); font-size:12px; margin-top:2px; font-weight:700; }

    /* Combo 徽章 */
    .combo {
      position:relative; z-index:1;
      margin-top:9px; display:flex; gap:7px;
    }
    .combo span {
      flex:1; padding:7px 4px; border-radius:10px;
      text-align:center; font-size:10.5px; font-weight:700;
      color:rgba(180,168,148,.65);
      border:1px solid rgba(200,159,46,.10);
      background:rgba(255,255,255,.028);
    }
    .combo .on {
      color: #0a0804; font-weight:900;
      background-size:200% 100%;
      background-image: linear-gradient(90deg,
        var(--plat-1) 0%, var(--gold-1) 30%, var(--copper) 60%, var(--gold-1) 85%, var(--plat-2) 100%);
      border:none;
      animation: comboShine 2.2s linear infinite;
      box-shadow: 0 0 18px rgba(200,154,46,.30), 0 3px 10px rgba(0,0,0,.4);
    }

    /* 按钮 */
    .actions { display:grid; grid-template-columns:1.2fr .8fr; gap:11px; }
    .btn {
      height:50px; border:0; border-radius:17px;
      font-weight:900; font-size:16px; cursor:pointer; letter-spacing:.02em;
    }
    .btn.go-btn {
      color:#04060a;
      background: linear-gradient(90deg, var(--plat-2), var(--gold-1), var(--copper));
      box-shadow: 0 8px 26px rgba(200,154,46,.28), 0 0 0 1px rgba(200,159,46,.20);
    }
    .btn.stop {
      color:rgba(240,232,220,.80);
      background: linear-gradient(90deg, #1c0c0c, #3a1010);
      border:1px solid rgba(184,48,48,.32);
      box-shadow: 0 6px 18px rgba(180,48,48,.16);
    }

    .caption {
      text-align:center; font-size:10.5px;
      color:rgba(126,136,152,.48); line-height:1.4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="phone" aria-label="HitRise 实时训练铂金奢华版">
      <div class="speed-lines"></div>
      <div class="metal-sweep"></div>
      <div class="metal-sweep-2"></div>

      <section class="content">

        <!-- 状态栏 -->
        <div class="status">
          <span>9:41</span>
          <span class="battery">SENBALL#A · ⬡ 86%</span>
        </div>

        <!-- HERO -->
        <section class="hero">
          <div class="top">
            <div>
              <div class="title">HitRise 实时训练</div>
              <div class="subtitle">METABOLIC BURN · 金属燃脂风</div>
            </div>
            <div class="gear">⚙ 训练设置</div>
          </div>
          <div class="goal">
            <strong>今日目标：500拳 · 已完成 186拳</strong>
            <small>目标进度 37% · 连续运动 06:18</small>
            <div class="bar"><i></i></div>
          </div>
        </section>

        <!-- DASH -->
        <section class="dash">
          <div class="round-row">
            <div class="label">实时搏击</div>
            <!-- 荧光绿保留 #1：ROUND 徽章 -->
            <div class="round">ROUND 2 / 3</div>
          </div>

          <div class="timer-area">
            <div class="ring-orbit-2"></div>
            <div class="ring">
              <div class="ring-orbit"></div>
              <div class="time">
                <b>00:42</b>
                <span>燃脂冲刺</span>
              </div>
            </div>
            <div class="go">3 · 2 · 1 · GO FIGHT</div>
          </div>

          <div class="metrics">
            <div class="metric white"><b>186</b><small>总击打数</small></div>
            <div class="metric bpm"><b>92</b><small>BPM 心率</small></div>
            <div class="metric hot"><b>31.8</b><small>卡路里 kcal</small></div>
            <!-- 荧光绿保留 #2：燃脂g -->
            <div class="metric fat"><b>4.1</b><small>等效燃脂 g</small></div>
          </div>

          <section class="force">
            <div class="force-head">
              <span>实时击打爆发力</span>
              <span class="peak">PEAK 1180</span>
            </div>
            <div class="bars">
              <i style="height:28%"></i>
              <i style="height:45%"></i>
              <i style="height:36%"></i>
              <i style="height:62%"></i>
              <i style="height:78%"></i>
              <i style="height:48%"></i>
              <i style="height:83%"></i>
              <i style="height:55%"></i>
              <i style="height:88%"></i>
              <i style="height:68%"></i>
              <i style="height:94%"></i>
              <i style="height:51%"></i>
              <i style="height:73%"></i>
              <i style="height:38%"></i>
            </div>
            <div class="summary">
              <span>MIN<b>420</b></span>
              <span>MAX<b>1180</b></span>
              <span>AVG<b>760</b></span>
            </div>
          </section>

          <div class="combo">
            <span class="on">✦ Power Burst</span>
            <span>三连击</span>
            <span>Jab-Cross</span>
          </div>
        </section>

        <!-- 按钮 -->
        <div class="actions">
          <button class="btn go-btn">继续爆发</button>
          <button class="btn stop">结束结算</button>
        </div>
        <div class="caption">正式开发将无缝保留现有蓝牙、回合及战报上传逻辑</div>

      </section>
    </main>
  </div>
</body>
</html>
