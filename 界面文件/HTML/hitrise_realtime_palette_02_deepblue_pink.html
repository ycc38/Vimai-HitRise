<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HitRise 实时训练配色 02 藏蓝粉紫雅致</title>
  <link rel="stylesheet" href="hitrise_realtime_training_palettes.css" />
  <style>
    :root {
      --page-top: #020613;
      --page-bottom: #09030a;
      --shell: #07152e;
      --shell-dark: #020512;
      --panel: #101a35;
      --hero: #063c85;
      --hero-light: #f7c3d9;
      --hero-text: #ffffff;
      --accent: #063c85;
      --highlight: #f7c3d9;
      --hot: #bb5799;
      --glow: #bb5799;
      --rim: #f7c3d9;
      --line: #bb5799;
      --text: #fff1fa;
      --muted: #b9b7d0;
      --subtle: #f7c3d9;
      --headline: #ffd7ea;
      --battery: #f7c3d9;
      --ring-core: #070d24;
      --force-hot: #bb5799;
      --force-mid: #f7c3d9;
      --force-low: #2d65bc;
      --chip: #bb5799;
      --chip-text: #fff8fd;
      --button: #f7c3d9;
      --button-hot: #bb5799;
      --button-text: #0b0b1e;
      --nav: #070d24;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="HitRise realtime training palette two">
      <div class="content">
        <div class="status">
          <div class="brand"><span class="brand-mark"></span><span>HitRise Live</span></div>
          <div>SENBALL#A</div>
          <div class="battery"><span class="battery-icon"></span><span>86%</span></div>
        </div>

        <section class="hero">
          <div class="hero-top">
            <div class="title">
              <h1>实时训练</h1>
              <p>深海藏蓝 + 柔樱粉 + 绛紫高能节拍</p>
            </div>
            <div class="gear">⚙</div>
          </div>
          <div class="goal">
            <strong>今日目标：500拳　已完成 286拳</strong>
            <div class="progress"><span></span></div>
          </div>
        </section>

        <section class="dashboard">
          <div class="timer-card">
            <div class="ring">
              <div class="ring-inner">
                <div>
                  <div class="time">00:42</div>
                  <div class="time-label">第 1 回合 / 沉浸律动</div>
                </div>
              </div>
            </div>
          </div>
          <div class="coach-card">
            <div class="coach-title"><span>AI 教练</span><span>节奏 92%</span></div>
            <div>
              <div class="punch-count">286</div>
              <div class="punch-label">累计击拳</div>
            </div>
            <div class="rhythm-wave">
              <i style="--h:36;--d:1"></i><i style="--h:74;--d:2"></i><i style="--h:48;--d:3"></i><i style="--h:88;--d:4"></i><i style="--h:58;--d:5"></i><i style="--h:94;--d:6"></i><i style="--h:46;--d:7"></i>
            </div>
          </div>
        </section>

        <section class="metrics">
          <div class="metric"><span>BPM</span><strong>118</strong><small>稳定跟拍</small></div>
          <div class="metric"><span>卡路里</span><strong>46.8</strong><small>kcal</small></div>
          <div class="metric"><span>等效燃脂</span><strong>6.1</strong><small>g</small></div>
        </section>

        <section class="dashboard">
          <div class="force-card">
            <div class="section-head"><span>相对力量评分</span><span class="force-value">742</span></div>
            <div class="force-bars">
              <i style="--h:22;--d:1"></i><i style="--h:42;--d:2"></i><i style="--h:55;--d:3"></i><i style="--h:69;--d:4"></i><i style="--h:80;--d:5"></i><i style="--h:50;--d:6"></i><i style="--h:90;--d:7"></i><i style="--h:46;--d:8"></i><i style="--h:76;--d:9"></i><i style="--h:96;--d:10"></i>
            </div>
            <div class="force-summary"><div>最小 315</div><div>平均 628</div><div>最大 1038</div></div>
          </div>
          <div class="report-card">
            <div class="section-head"><span>音乐节拍</span><span>120 BPM</span></div>
            <div class="beat-line"><div class="beat"></div><div class="accuracy">84%</div></div>
            <div class="combo"><span>Jab-Cross</span><span>连续 12拳</span><span>Perfect +8</span></div>
          </div>
        </section>

        <section class="action-bar">
          <button class="btn">开始</button>
          <button class="btn secondary">结束</button>
        </section>

        <section class="mode-row">
          <span>训练设置</span>
          <strong>初学者｜1分钟 x 3回合</strong>
        </section>

        <nav class="nav">
          <div class="active"><b></b><span>训练中心</span></div>
          <div><b></b><span>锻炼成果</span></div>
          <div><b></b><span>榜单排名</span></div>
          <div><b></b><span>个人中心</span></div>
        </nav>
      </div>
    </section>
  </main>
</body>
</html>
