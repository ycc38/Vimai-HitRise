<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HitRise 实时训练金属燃脂动效 - 极速进化版</title>
  <style>
    :root {
      /* 核心燃脂多巴胺配色 */
      --ink: #020505;
      --bg-dark: #060b0d;
      --panel-bg: rgba(16, 24, 27, 0.85);
      
      /* 高能警示与代谢反馈色 */
      --burn-orange: #ff5e3a;      /* 燃脂橙 */
      --burn-red: #ff2a54;         /* 爆发红 */
      --cyber-neon: #2effa3;       /* 电光绿（高效代谢） */
      --cyber-blue: #00f0ff;       /* 科技蓝（稳定连接） */
      
      --text-white: #ffffff;
      --text-main: #f1f5f4;
      --muted: #738287;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 8%, rgba(255, 42, 84, 0.2), transparent 45%),
        radial-gradient(circle at 85% 35%, rgba(46, 255, 163, 0.08), transparent 40%),
        linear-gradient(180deg, #010304, #070c0f 65%, #020405);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { padding: 20px; }

    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      border-radius: 42px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: var(--bg-dark);
      box-shadow:
        0 40px 90px rgba(0, 0, 0, 0.85),
        inset 0 1px 2px rgba(255, 255, 255, 0.15),
        0 0 45px rgba(255, 94, 58, 0.06);
    }

    /* 破风粒子线条 - 模拟持续运动的位移感 */
    .speed-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.4;
      background:
        repeating-linear-gradient(115deg, transparent 0 40px, rgba(255, 255, 255, 0.02) 40px 41px, transparent 41px 80px),
        linear-gradient(125deg, transparent 0 35%, rgba(46, 255, 163, 0.02) 35% 36%, transparent 36% 65%, rgba(255, 42, 84, 0.03) 65% 66%, transparent 66%);
      animation: speedSlide 4s linear infinite;
    }

    /* 液态金属掠影 */
    .metal-sweep {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background: linear-gradient(105deg, transparent 25%, rgba(255, 255, 255, 0.22) 28%, rgba(255, 255, 255, 0.08) 31%, transparent 40%);
      transform: translateX(-130%);
      animation: sweep 3.8s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    @keyframes speedSlide {
      from { transform: translateY(-40px) translateX(-20px); }
      to { transform: translateY(40px) translateX(20px); }
    }

    @keyframes sweep {
      0%, 35% { transform: translateX(-130%); }
      75%, 100% { transform: translateX(130%); }
    }

    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 16px 16px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 顶部状态栏 */
    .status {
      height: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .battery {
      color: var(--cyber-blue);
      background: rgba(0, 240, 255, 0.08);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    /* 强化玻璃拟态外壳 */
    .hero, .dash {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.07);
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.04),
        0 16px 32px rgba(0, 0, 0, 0.45);
    }

    .hero {
      padding: 16px;
      border-radius: 24px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--text-white), #d5e4e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--cyber-blue);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .gear {
      height: 36px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-white);
      background: rgba(255, 255, 255, 0.05);
      font-size: 12px;
      font-weight: 700;
    }

    /* 今日目标进度舱 */
    .goal {
      margin-top: 14px;
      border-radius: 16px;
      padding: 14px;
      background: linear-gradient(135deg, rgba(255, 94, 58, 0.12), rgba(255, 42, 84, 0.04));
      border: 1px solid rgba(255, 94, 58, 0.22);
    }

    .goal strong {
      display: block;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-white);
    }

    .goal small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .bar {
      margin-top: 10px;
      height: 8px;
      border-radius: 99px;
      background: rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .bar i {
      display: block;
      width: 37%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--burn-orange), var(--burn-red));
      box-shadow: 0 0 12px var(--burn-orange);
      animation: progressDrive 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes progressDrive {
      0%, 100% { width: 37%; filter: brightness(1); }
      50% { width: 39%; filter: brightness(1.25) drop-shadow(0 0 6px var(--burn-orange)); }
    }

    /* 实时运动主仪表盘 */
    .dash {
      flex: 1;
      border-radius: 28px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .round-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .label {
      color: var(--text-white);
      font-weight: 800;
      font-size: 16px;
    }

    .round {
      padding: 5px 14px;
      border-radius: 999px;
      color: var(--ink);
      background: linear-gradient(90deg, var(--cyber-neon), #9effd4);
      font-weight: 900;
      font-size: 12px;
      box-shadow: 0 0 15px rgba(46, 255, 163, 0.25);
      letter-spacing: 0.5px;
    }

    /* 复合流光计时圆环 */
    .timer-area {
      position: relative;
      height: 160px;
      display: grid;
      place-items: center;
      margin: 8px 0;
    }

    .ring {
      position: relative;
      width: 146px;
      height: 146px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(from -90deg, var(--burn-orange) 0 48%, var(--cyber-neon) 48% 72%, rgba(255, 255, 255, 0.05) 72% 100%);
      box-shadow: 
        0 0 25px rgba(255, 94, 58, 0.12),
        inset 0 0 20px rgba(0,0,0,0.6);
      animation: pulseGlow 2s ease-in-out infinite;
    }

    .ring::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: radial-gradient(circle, #0d1618 0%, #05090a 100%);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 22px rgba(255, 94, 58, 0.12); }
      50% { transform: scale(1.02); box-shadow: 0 0 32px rgba(255, 94, 58, 0.25); }
    }

    .time {
      position: relative;
      text-align: center;
      z-index: 2;
    }

    .time b {
      display: block;
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #ffffff 0%, #a9bdc4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .time span {
      color: var(--burn-orange);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 3px;
      display: block;
    }

    .go {
      position: absolute;
      bottom: -6px;
      text-align: center;
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
      animation: goBlink 1.2s infinite;
    }

    @keyframes goBlink {
      0%, 100% { opacity: 0.3; transform: scale(0.96); }
      50% { opacity: 0.95; color: var(--cyber-neon); transform: scale(1.04); }
    }

    /* 核心数据矩阵 */
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .metric {
      border-radius: 16px;
      padding: 10px 4px;
      text-align: center;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .metric b {
      display: block;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .metric small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    /* 高亮多巴胺反馈指标 */
    .metric.hot b { 
      color: var(--burn-orange); 
      text-shadow: 0 0 12px rgba(255, 94, 58, 0.25);
    }
    .metric.fat b { 
      color: var(--cyber-neon); 
      text-shadow: 0 0 12px rgba(46, 255, 163, 0.25);
    }

    /* 实时搏击爆发力波形图 */
    .force {
      border-radius: 20px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .force-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .peak {
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 42, 84, 0.12);
      color: #ff8ca3;
      font-weight: 800;
      font-size: 11px;
      border: 1px solid rgba(255, 42, 84, 0.25);
    }

    .bars {
      height: 70px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding-top: 4px;
    }

    .bars i {
      flex: 1;
      border-radius: 4px 4px 1px 1px;
      /* 四色热力量表层叠：蓝 -> 绿 -> 橙 -> 红 */
      background: linear-gradient(180deg, var(--burn-red) 0%, var(--burn-orange) 40%, var(--cyber-neon) 80%, var(--cyber-blue) 100%);
      animation: barPulse 1.4s ease-in-out infinite alternate;
    }

    .bars i:nth-child(3n) { animation-delay: 0.2s; animation-duration: 1.1s; }
    .bars i:nth-child(2n+1) { animation-delay: 0.3s; animation-duration: 1.5s; }

    @keyframes barPulse {
      0% { transform: scaleY(0.96); filter: brightness(0.95); }
      100% { transform: scaleY(1.04); filter: brightness(1.15); }
    }

    .summary {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .summary b {
      color: var(--text-white);
      display: block;
      margin-top: 2px;
      font-size: 13px;
      font-weight: 700;
    }

    /* 组合爆发连击徽章（强化运动粘性行为） */
    .combo {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .combo span {
      flex: 1;
      padding: 8px 4px;
      border-radius: 12px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(255, 255, 255, 0.02);
    }

    .combo .on {
      color: var(--text-white);
      font-weight: 900;
      background: linear-gradient(135deg, var(--burn-orange), var(--burn-red));
      border: none;
      box-shadow: 0 4px 12px rgba(255, 94, 58, 0.35);
      animation: comboGlow 0.8s ease-in-out infinite alternate;
    }

    @keyframes comboGlow {
      from { filter: drop-shadow(0 0 2px var(--burn-orange)); }
      to { filter: drop-shadow(0 0 8px var(--burn-red)); }
    }

    /* 底部交互控制区 */
    .actions {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 12px;
      margin-top: 4px;
    }

    .btn {
      height: 48px;
      border: 0;
      border-radius: 16px;
      color: var(--ink);
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      background: linear-gradient(90deg, var(--cyber-neon), #a1ffd6);
      box-shadow: 0 8px 20px rgba(46, 255, 163, 0.2);
    }

    .btn.stop {
      color: rgba(255, 255, 255, 0.85);
      background: linear-gradient(90deg, #2b1313, #3f1717);
      border: 1px solid rgba(255, 42, 84, 0.35);
      box-shadow: none;
    }

    .caption {
      color: rgba(115, 130, 135, 0.65);
      text-align: center;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="phone" aria-label="HitRise 实时训练高燃版">
      <div class="speed-lines"></div>
      <div class="metal-sweep"></div>
      
      <section class="content">
        <div class="status">
          <span>9:41</span>
          <span class="battery">SENBALL#A · 🔋 86%</span>
        </div>

        <section class="hero">
          <div class="top">
            <div>
              <div class="title">HitRise 实时训练</div>
              <div class="subtitle">METABOLIC BURN · 金属燃脂风</div>
            </div>
            <div class="gear">⚙️ 训练设置</div>
          </div>
          <div class="goal">
            <strong>今日目标：500拳 · 已完成 186拳</strong>
            <small>目标进度 37% · 连续运动 06:18</small>
            <div class="bar"><i></i></div>
          </div>
        </section>

        <section class="dash">
          <div class="round-row">
            <div class="label">实时搏击</div>
            <div class="round">ROUND 2 / 3</div>
          </div>

          <div class="timer-area">
            <div class="ring">
              <div class="time">
                <b>00:42</b>
                <span>燃脂冲刺</span>
              </div>
            </div>
            <div class="go">3 · 2 · 1 · GO FIGHT</div>
          </div>

          <div class="metrics">
            <div class="metric"><b>186</b><small>总击打数</small></div>
            <div class="metric" style="border-color: rgba(0,240,255,0.15)">
              <b style="color:var(--cyber-blue)">92</b><small>BPM 心率</small>
            </div>
            <div class="metric hot"><b>31.8</b><small>卡路里 kcal</small></div>
            <div class="metric fat"><b>4.1</b><small>等效燃脂 g</small></div>
          </div>

          <section class="force">
            <div class="force-head">
              <span>实时击打爆发力</span>
              <span class="peak">PEAK 1180</span>
            </div>
            <div class="bars">
              <i style="height:28%"></i>
              <i style="height:45%"></i>
              <i style="height:36%"></i>
              <i style="height:62%"></i>
              <i style="height:78%"></i>
              <i style="height:48%"></i>
              <i style="height:83%"></i>
              <i style="height:55%"></i>
              <i style="height:88%"></i>
              <i style="height:68%"></i>
              <i style="height:94%"></i>
              <i style="height:51%"></i>
              <i style="height:73%"></i>
              <i style="height:38%"></i>
            </div>
            <div class="summary">
              <span>MIN<b>420</b></span>
              <span>MAX<b>1180</b></span>
              <span>AVG<b>760</b></span>
            </div>
          </section>

          <div class="combo">
            <span class="on">🔥 Power Burst</span>
            <span>三连击</span>
            <span>Jab-Cross</span>
          </div>
        </section>

        <div class="actions">
          <button class="btn">继续爆发</button>
          <button class="btn stop">结束结算</button>
        </div>
        <div class="caption">正式开发将无缝保留现有蓝牙、回合及战报上传逻辑</div>
      </section>
    </main>
  </div>
</body>
</html>
