<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HitRise 实时训练配色 01 晴空橙光奶油</title>
  <link rel="stylesheet" href="hitrise_realtime_training_palettes.css" />
  <style>
    :root {
      --page-top: #031018;
      --page-bottom: #050404;
      --shell: #06202c;
      --shell-dark: #02080d;
      --panel: #102b37;
      --hero: #1387c0;
      --hero-light: #faedd1;
      --hero-text: #ffffff;
      --accent: #1387c0;
      --highlight: #faedd1;
      --hot: #f4520d;
      --glow: #f4520d;
      --rim: #faedd1;
      --line: #faedd1;
      --text: #fff7e8;
      --muted: #b8c8c9;
      --subtle: #facfa8;
      --headline: #ffe8be;
      --battery: #66d9ff;
      --ring-core: #06151b;
      --force-hot: #f4520d;
      --force-mid: #ffaf57;
      --force-low: #1387c0;
      --chip: #f4520d;
      --chip-text: #fff7e8;
      --button: #faedd1;
      --button-hot: #f4520d;
      --button-text: #061018;
      --nav: #06151b;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="HitRise realtime training palette one">
      <div class="content">
        <div class="status">
          <div class="brand"><span class="brand-mark"></span><span>HitRise Live</span></div>
          <div>SENBALL#A</div>
          <div class="battery"><span class="battery-icon"></span><span>86%</span></div>
        </div>

        <section class="hero">
          <div class="hero-top">
            <div class="title">
              <h1>实时训练</h1>
              <p>晴空海蓝 + 奶油米白 + 暖橙燃脂节奏</p>
            </div>
            <div class="gear">⚙</div>
          </div>
          <div class="goal">
            <strong>今日目标：500拳　已完成 286拳</strong>
            <div class="progress"><span></span></div>
          </div>
        </section>

        <section class="dashboard">
          <div class="timer-card">
            <div class="ring">
              <div class="ring-inner">
                <div>
                  <div class="time">00:42</div>
                  <div class="time-label">第 1 回合 / 燃脂冲刺</div>
                </div>
              </div>
            </div>
          </div>
          <div class="coach-card">
            <div class="coach-title"><span>AI 教练</span><span>节奏 92%</span></div>
            <div>
              <div class="punch-count">286</div>
              <div class="punch-label">累计击拳</div>
            </div>
            <div class="rhythm-wave">
              <i style="--h:34;--d:1"></i><i style="--h:68;--d:2"></i><i style="--h:44;--d:3"></i><i style="--h:82;--d:4"></i><i style="--h:56;--d:5"></i><i style="--h:92;--d:6"></i><i style="--h:48;--d:7"></i>
            </div>
          </div>
        </section>

        <section class="metrics">
          <div class="metric"><span>BPM</span><strong>118</strong><small>连续运动</small></div>
          <div class="metric"><span>卡路里</span><strong>46.8</strong><small>kcal</small></div>
          <div class="metric"><span>等效燃脂</span><strong>6.1</strong><small>g</small></div>
        </section>

        <section class="dashboard">
          <div class="force-card">
            <div class="section-head"><span>相对力量评分</span><span class="force-value">742</span></div>
            <div class="force-bars">
              <i style="--h:24;--d:1"></i><i style="--h:38;--d:2"></i><i style="--h:52;--d:3"></i><i style="--h:66;--d:4"></i><i style="--h:78;--d:5"></i><i style="--h:54;--d:6"></i><i style="--h:86;--d:7"></i><i style="--h:44;--d:8"></i><i style="--h:72;--d:9"></i><i style="--h:92;--d:10"></i>
            </div>
            <div class="force-summary"><div>最小 315</div><div>平均 628</div><div>最大 1038</div></div>
          </div>
          <div class="report-card">
            <div class="section-head"><span>动感节拍</span><span>120 BPM</span></div>
            <div class="beat-line"><div class="beat"></div><div class="accuracy">84%</div></div>
            <div class="combo"><span>Power Burst</span><span>连续 12拳</span><span>Perfect +8</span></div>
          </div>
        </section>

        <section class="action-bar">
          <button class="btn">开始</button>
          <button class="btn secondary">结束</button>
        </section>

        <section class="mode-row">
          <span>训练设置</span>
          <strong>初学者｜1分钟 x 3回合</strong>
        </section>

        <nav class="nav">
          <div class="active"><b></b><span>训练中心</span></div>
          <div><b></b><span>锻炼成果</span></div>
          <div><b></b><span>榜单排名</span></div>
          <div><b></b><span>个人中心</span></div>
        </nav>
      </div>
    </section>
  </main>
</body>
</html>
