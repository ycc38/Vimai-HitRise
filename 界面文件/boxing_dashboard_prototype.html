
<style>
*{box-sizing:border-box;margin:0;padding:0}
.phone-wrap{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:20px;display:flex;justify-content:center}

.top-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px}

.timer-ring{display:flex;flex-direction:column;align-items:center;margin:4px 0 14px}

.metrics-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.metric{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 8px;text-align:center}
.metric .val{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.metric .lbl{font-size:10px;color:var(--color-text-secondary);margin-top:2px}
.metric .unit{font-size:10px;color:var(--color-text-tertiary)}

.section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

.wave-wrap{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px;margin-bottom:12px;position:relative;height:72px}
.wave-canvas{width:100%;height:100%;display:block}

.hand-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.hand-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px}
.hand-label{font-size:10px;color:var(--color-text-secondary);margin-bottom:6px;display:flex;align-items:center;gap:4px}

.bar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.bar-l{background:#378ADD}
.bar-r{background:#D85A30}
.hand-pct{font-size:16px;font-weight:500;color:var(--color-text-primary)}
.hand-sub{font-size:10px;color:var(--color-text-secondary)}

.combo-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.combo-pill{font-size:10px;padding:4px 9px;border-radius:20px;border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);background:var(--color-background-primary)}
.combo-pill.active{background:var(--color-background-success);color:var(--color-text-success);border-color:transparent}

.ctrl-row{display:flex;gap:8px;margin-top:4px}
.ctrl-btn{flex:1;padding:10px 0;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);font-size:12px;font-weight:500;color:var(--color-text-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.ctrl-btn:hover{background:var(--color-background-secondary)}
.ctrl-btn.primary{background:var(--color-background-danger);color:var(--color-text-danger);border-color:transparent}
.ctrl-btn.primary:hover{opacity:.85}

.divider{height:0.5px;background:var(--color-border-tertiary);margin:10px 0}
</style>

<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
  <button onclick="sendPrompt('请详细设计训练结束后的成绩总结页面，包括数据卡片布局和分享功能 ↗')" style="font-size:12px;padding:7px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer">训练结束页设计 ↗</button>

</div>

<script>
const ROUND_SECS = 180;
let elapsed = 0, paused = false, punches = 0, leftSum = 0, rightSum = 0, leftCount = 0, rightCount = 0, peakForce = 0, timerRef, punchRef;
const waveData = [];
const MAX_WAVE = 42;
const GOAL = 500;

function fmt(s){const m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+s%60}

function drawWave(){
  const c=document.getElementById('waveCanvas');
  if(!c)return;
  const ctx=c.getContext('2d');
  const W=c.offsetWidth||280,H=52;
  c.width=W;c.height=H;
  ctx.clearRect(0,0,W,H);
  const bw=Math.max(4,Math.floor((W-MAX_WAVE)/MAX_WAVE));
  const gap=2;
  const step=bw+gap;
  for(let i=0;i<waveData.length;i++){
    const x=W-(waveData.length-i)*step;
    const h=Math.max(3,Math.round(waveData[i]/100*H*0.9));
    const y=H-h;
    ctx.fillStyle=waveData[i]>70?'#E24B4A':waveData[i]>40?'#BA7517':'#378ADD';
    ctx.beginPath();
    ctx.roundRect(x,y,bw,h,2);
    ctx.fill();
  }
}

function addPunch(){
  if(paused)return;
  const isLeft=Math.random()>0.5;
  const force=Math.round(20+Math.random()*80);
  punches++;
  if(isLeft){leftSum+=force;leftCount++;}else{rightSum+=force;rightCount++;}
  if(force>peakForce)peakForce=force;
  waveData.push(force);
  if(waveData.length>MAX_WAVE)waveData.shift();

  document.getElementById('punch-count').textContent=punches;
  document.getElementById('bpm-val').textContent=Math.round(punches/(Math.max(elapsed,1)/60));
  document.getElementById('kcal-val').textContent=Math.round(punches*0.12);
  document.getElementById('peak-tag').textContent='峰值 '+peakForce+' N';
  document.getElementById('goal-progress').textContent='已完成 '+Math.min(100,Math.round(punches/GOAL*100))+'%';

  const la=leftCount?Math.round(leftSum/leftCount):0;
  const ra=rightCount?Math.round(rightSum/rightCount):0;
  const mx=Math.max(la,ra,1);
  document.getElementById('pct-l').textContent=la+' N';
  document.getElementById('pct-r').textContent=ra+' N';
  document.getElementById('bar-l').style.width=Math.round(la/mx*100)+'%';
  document.getElementById('bar-r').style.width=Math.round(ra/mx*100)+'%';

  const combos=['c1','c2','c3','c4','c5'];
  combos.forEach(id=>document.getElementById(id).classList.remove('active'));
  if(punches%7===0)document.getElementById('c4').classList.add('active');
  else if(punches%11===0)document.getElementById('c5').classList.add('active');
  else{const r=combos[Math.floor(Math.random()*3)];document.getElementById(r).classList.add('active');}

  drawWave();
}

function tick(){
  if(paused)return;
  elapsed++;
  const rem=ROUND_SECS-elapsed;
  if(rem<=0){clearInterval(timerRef);clearInterval(punchRef);document.getElementById('timer-display').textContent='0:00';return;}
  document.getElementById('timer-display').textContent=fmt(rem);
  const pct=elapsed/ROUND_SECS;
  const circ=289;
  document.getElementById('ring').setAttribute('stroke-dashoffset',Math.round(circ*pct));
  document.getElementById('ring').setAttribute('stroke',rem<30?'#E24B4A':rem<60?'#BA7517':'#E24B4A');
}

function togglePause(){
  paused=!paused;
  document.getElementById('pause-icon').className='ti '+(paused?'ti-player-play':'ti-player-pause');
  document.getElementById('pause-label').textContent=paused?'继续':'暂停';
}

function resetSim(){
  clearInterval(timerRef);clearInterval(punchRef);
  elapsed=0;punches=0;leftSum=0;rightSum=0;leftCount=0;rightCount=0;peakForce=0;paused=false;
  waveData.length=0;
  document.getElementById('timer-display').textContent='3:00';
  document.getElementById('ring').setAttribute('stroke-dashoffset','0');
  document.getElementById('punch-count').textContent='0';
  document.getElementById('bpm-val').textContent='—';
  document.getElementById('kcal-val').textContent='0';
  document.getElementById('peak-tag').textContent='峰值 — N';
  document.getElementById('pct-l').textContent='—';
  document.getElementById('pct-r').textContent='—';
  document.getElementById('bar-l').style.width='0%';
  document.getElementById('bar-r').style.width='0%';
  document.getElementById('goal-progress').textContent='已完成 0%';
  document.getElementById('pause-icon').className='ti ti-player-pause';
  document.getElementById('pause-label').textContent='暂停';
  ['c1','c2','c3','c4','c5'].forEach(id=>document.getElementById(id).classList.remove('active'));
  drawWave();
  startSim();
}

function startSim(){
  timerRef=setInterval(tick,1000);
  punchRef=setInterval(()=>{if(!paused&&Math.random()>0.35)addPunch();},600);
}

startSim();
</script>
